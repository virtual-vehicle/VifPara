[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vifpara"
version = "1.3.4"
description = "Python library that automates ParaView to produce high‑quality visuals from OpenFOAM and MESHFREE simulations."
authors = [
  { name = "Cyril Marx", email = "cyril.marx@v2c2.at" }
]
license = "MIT"
license-files = ["LICENSE.txt"]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy==1.26.4",
  "colorama",
  "scipy"
]

[project.urls]
"Source Code" = "https://github.com/virtual-vehicle/VifPara"
"Documentation" = "https://vifpara.readthedocs.io/en/latest/"
"Issue Tracker" = "https://github.com/virtual-vehicle/VifPara/issues"
"Changelog" = "https://vifpara.readthedocs.io/en/latest/UPDATES.html"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
vifpara = "scripts.runner:run"
